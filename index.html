<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Program Keluarga</title>
<meta name="theme-color" content="#2b2a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Keluarga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#ffffff;--ink:#22223a;--muted:#77748a;--line:#ece6dc;
--night:#5b5bd6;--night-soft:#ecebff;--dawn:#e8873a;--dawn-soft:#fff0e2;--water:#2f9ee0;--water-soft:#e3f3fd;--sleep:#8b5cf6;--sleep-soft:#f1eaff;--note:#2fa37a;--note-soft:#e2f6ee;--chore:#16a3a3;--chore-soft:#def5f5;--sport:#d9488f;--sport-soft:#fde8f1;--screen:#f59e0b;--screen-soft:#fff4d6;--bad:#e05a4f;--bad-soft:#fde9e7;--good:#2fa37a;--good-soft:#e2f6ee}
@media (prefers-color-scheme:dark){:root{--bg:#16161f;--card:#20202c;--ink:#efeef6;--muted:#a3a1b6;--line:#33323f;--night-soft:#2a2a4d;--dawn-soft:#3b2a1d;--water-soft:#18324a;--sleep-soft:#2e2447;--note-soft:#173528;--chore-soft:#173838;--sport-soft:#3d1f2e;--screen-soft:#3b2f14;--bad-soft:#3d2220;--good-soft:#173528}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.hero{position:relative;max-width:640px;margin:0 auto;overflow:hidden;border-radius:0 0 28px 28px}
.hero svg{display:block;width:100%;height:auto}
.hero .txt{position:absolute;left:20px;right:20px;top:18px;color:#fff}
.hero h1{margin:0;font-size:22px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.hero .greet{font-size:14px;opacity:.92;font-weight:600}
.hero .pill{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg{width:28px;height:28px}
.ch h2{margin:0;font-size:16.5px;font-weight:800}
.ch p{margin:0;color:var(--muted);font-size:12.5px}
.night .ic{background:var(--night-soft)}.dawn .ic{background:var(--dawn-soft)}.water .ic{background:var(--water-soft)}.sleep .ic{background:var(--sleep-soft)}.note .ic{background:var(--note-soft)}
.chore .ic{background:var(--chore-soft)}.sport .ic{background:var(--sport-soft)}
.chore{border-top:4px solid var(--chore)}.sport{border-top:4px solid var(--sport)}
.screen{border-top:4px solid var(--screen)}.screen .ic{background:var(--screen-soft)}.st.sc{background:var(--screen-soft)}
.hm{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.hm input{width:76px;height:44px;border:2px solid var(--line);border-radius:14px;padding:0 10px;font:inherit;font-weight:800;font-size:17px;background:var(--bg);color:var(--ink);text-align:center}
.hm input:focus{outline:none;border-color:var(--screen)}
.screen textarea:focus{border-color:var(--screen)}
.tasks{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border:2px solid var(--line);border-radius:16px;cursor:pointer;user-select:none;font-weight:700;font-size:14px}
.task input{position:absolute;opacity:0;pointer-events:none}
.task .em{font-size:24px;line-height:1}
.task .tx{flex:1}
.task .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:0 0 auto}
.task:has(input:checked){background:var(--chore-soft);border-color:var(--chore)}
.task:has(input:checked) .bx{background:var(--chore);border-color:var(--chore)}
.task:has(input:checked) .bx::after{content:"✓";font-weight:800}
.task small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.sport .task:has(input:checked){background:var(--sport-soft);border-color:var(--sport)}
.sport .task:has(input:checked) .bx{background:var(--sport);border-color:var(--sport)}
.chips.pos label:has(input:checked){background:var(--sport-soft);border-color:var(--sport)}
.tiles.four{grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.four .tile{font-size:12.5px;padding:10px 2px}
.soon:not(.open)>*:not(.ch):not(.soonbar){display:none}
.soonbar{width:100%;border:2px dashed var(--line);background:var(--bg);color:var(--muted);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-align:left}
.soon.open .soonbar{margin-bottom:12px}
.fld{display:block;margin-top:12px;font-weight:700;font-size:14px}
.fld input{display:block;width:100%;height:44px;margin-top:6px;border:2px solid var(--line);border-radius:14px;padding:0 12px;font:inherit;font-weight:700;background:var(--bg);color:var(--ink)}
.fld textarea{margin-top:6px;min-height:110px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.sleepbig.sbig b{font-size:30px;color:var(--sport);font-weight:800}
.st.c{background:var(--chore-soft)}.st.p{background:var(--sport-soft)}
.night{border-top:4px solid var(--night)}.dawn{border-top:4px solid var(--dawn)}.water{border-top:4px solid var(--water)}.sleep{border-top:4px solid var(--sleep)}.note{border-top:4px solid var(--note)}
.q{font-weight:700;margin:14px 0 8px;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.three{grid-template-columns:1fr 1fr 1fr}
.tiles input,.chips input{position:absolute;opacity:0;pointer-events:none}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:2px solid var(--line);border-radius:16px;cursor:pointer;user-select:none;font-weight:700;font-size:13.5px;text-align:center;transition:transform .12s,background .12s}
.tile .em{font-size:28px;line-height:1}
.tile:active{transform:scale(.96)}
.tile:has(input:checked){background:var(--good-soft);border-color:var(--good)}
.tile.neg:has(input:checked){background:var(--bad-soft);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{padding:8px 12px;border:2px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;font-size:13.5px;font-weight:600}
.chips label:has(input:checked){background:var(--bad-soft);border-color:var(--bad)}
textarea{width:100%;min-height:70px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--note)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.datebar input{flex:1;height:44px;border:2px solid var(--line);border-radius:14px;padding:0 10px;font:inherit;font-weight:700;background:var(--card);color:var(--ink);text-align:center}
.daylabel{margin-top:8px;color:var(--muted);font-size:13px;text-align:center}
.tag{display:inline-block;background:var(--good-soft);color:var(--good);font-weight:800;font-size:11.5px;padding:2px 8px;border-radius:999px;margin-left:4px}
.save{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#5b5bd6,#8b5cf6 55%,#e8873a);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(91,91,214,.3)}
.save:active{transform:scale(.98)}
.save:disabled{opacity:.55}
.status{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
.hide{display:none}
/* water */
.glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.glass{border:0;background:none;padding:0;cursor:pointer;transition:transform .12s}
.glass:active{transform:scale(.9)}
.glass svg{width:100%;height:auto;display:block}
.glass .lvl{transition:y .25s,height .25s}
.wtotal{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:10px}
.wtotal b{font-size:30px;color:var(--water);font-weight:800}
.wtotal span{color:var(--muted);font-weight:700}
.mini{display:flex;justify-content:center;gap:8px;margin-top:6px}
.mini button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:4px 12px;font-weight:800;cursor:pointer}
/* sleep */
.sleepbig{display:flex;align-items:center;justify-content:center;gap:10px}
.sleepbig b{font-size:34px;color:var(--sleep);font-weight:800}
.sleepbig span{color:var(--muted);font-weight:700}
.zz{font-size:26px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;margin:14px 0 4px;background:linear-gradient(90deg,var(--line) 0%,var(--line) 57.1%,var(--sleep-soft) 57.1%,var(--sleep-soft) 71.4%,var(--line) 71.4%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sleep);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--sleep);border:4px solid #fff;cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
.unset{opacity:.45}
/* weekly */
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.weeks button{flex:0 0 auto;padding:9px 13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;cursor:pointer;font-family:inherit}
.weeks button.on{background:var(--night);border-color:var(--night);color:#fff}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.st .em{font-size:22px}
.st b{font-size:22px;font-weight:800}
.st small{color:var(--muted);font-size:12px;font-weight:600}
.st.n{background:var(--night-soft)}.st.d{background:var(--dawn-soft)}.st.w{background:var(--water-soft)}.st.s{background:var(--sleep-soft)}
.ok{color:var(--good)}.no{color:var(--bad)}
.check label{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;font-weight:600;cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--good)}
/* summary */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.dot{height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:4px}
.dot.g{background:var(--good-soft)}.dot.r{background:var(--bad-soft)}
.dot.v{font-size:13px;font-weight:800;color:var(--ink)}
.sub2{font-size:13.5px;font-weight:800;margin:14px 0 8px}
.sub2:first-of-type{margin-top:0}
.ringrow{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:0 0 auto}
.phase b{display:block;font-size:18px;font-weight:800}
.phase span{color:var(--muted);font-size:13px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{border-radius:16px;padding:12px;text-align:center}
.badge .em{font-size:30px}
.badge b{display:block;font-size:22px;font-weight:800}
.badge small{color:var(--muted);font-weight:700;font-size:12px}
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:12px;font-weight:800}
.track{position:relative;height:12px;background:var(--bg);border-radius:6px;margin:3px 0}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--night)}
.fill.s{background:var(--dawn)}
.tgt{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.banner{background:var(--bad-soft);border:2px solid var(--bad);border-radius:16px;padding:10px 12px;font-size:13px;margin-bottom:12px;font-weight:600}
ul.plain{margin:0;padding-left:0;list-style:none;font-size:14px;font-weight:600}
ul.plain li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
ul.plain li:last-child{border-bottom:0}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:6px 0}
.empty .em{font-size:34px;display:block}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tabbar div{max-width:640px;margin:0 auto;display:flex;gap:6px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:800;font-size:12px}
.tabbar a .em{font-size:22px;filter:grayscale(1);opacity:.6}
.tabbar a.on{background:var(--night-soft);color:var(--night)}
.tabbar a.on .em{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

<script>
(function(){
var KEY='catatan-keluarga-v1',storeOk=true;
function loadState(){try{var t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){storeOk=false}return {daily:{},weekly:{}}}
var state=loadState();
state.daily=state.daily||{};state.weekly=state.weekly||{};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var cfg=state.config=state.config||{};
var START='2026-11-23',DAY=864e5,MAXG=12,REF_MINUM=+cfg.minum||8,REF_TIDUR=+cfg.tidur||8,JAM=cfg.jam||'21.00';
var MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var DAYS_FULL=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var CELAH=[['WA di HP','💬'],['Browser HP/tablet','🌐'],['Laptop','💻'],['Perangkat lain','📱'],['Minta tambahan waktu','⏳']];
var CEK=['Ayah dan ibu memberi jawaban yang sama','Konsekuensi dijalankan tanpa marah','Tidak ada tambahan waktu di luar kesepakatan','HP orang tua ikut dikumpulkan','Kepatuhan anak diakui dengan kata-kata','Ayah ikut Subuh berjamaah bersama anak'];
var QS=[['😊','Apa yang paling mudah dijalankan minggu ini?'],['🤔','Malam mana yang paling sulit berhenti, dan apa yang terjadi saat itu?'],['⚖️','Ada aturan yang terasa tidak adil atau tidak masuk akal?'],['🚀','Satu hal yang ingin dicoba minggu depan?']];
var TUGAS_H=cfg.tugasH&&cfg.tugasH.length?cfg.tugasH:[['kamar','Merapikan kamar','🛏️'],['piring','Mencuci piring setelah makan','🍽️'],['baju','Menyiapkan baju sendiri','👕']];
var TUGAS_M=cfg.tugasM?cfg.tugasM:[['cuci','Mencuci & menyetrika baju sendiri','🧺'],['masak','Memasak satu menu','🍳']];
var JENIS=[['Jalan pagi','🚶'],['Lari','🏃'],['Renang','🏊'],['Bersepeda','🚴'],['Bulu tangkis','🏸'],['Lainnya','⚽']];
var REF_OLAHRAGA=+cfg.olahraga||60;
var REF_WA=+cfg.wa||120;
var MOOD=[['senang','Senang','😄'],['biasa','Biasa','🙂'],['capek','Capek','🥱'],['kesal','Kesal','😠']];
function fmtHM(m){if(m==null)return '–';m=Math.round(m);var h=Math.floor(m/60),mm=m%60;return h?(h+'j'+(mm?' '+mm+'m':'')):mm+'m'}
function hm(name,val){return '<div class="hm"><input type="number" inputmode="numeric" min="0" max="24" name="'+name+'J" value="'+(val==null?'':Math.floor(val/60))+'" placeholder="0"><span>jam</span><input type="number" inputmode="numeric" min="0" max="59" name="'+name+'M" value="'+(val==null?'':val%60)+'" placeholder="0"><span>menit</span></div>'}
var IC={

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toT(s){return Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))}
function fromT(t){var d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(s,n){return fromT(toT(s)+n*DAY)}
function dow(s){return new Date(toT(s)).getUTCDay()}
function nice(s){return DAYS_FULL[dow(s)]+', '+(+s.slice(8,10))+' '+MONTHS[+s.slice(5,7)-1]+' '+s.slice(0,4)}
function short(s){return (+s.slice(8,10))+' '+MONTHS[+s.slice(5,7)-1]}
function weekOf(s){var d=Math.floor((toT(s)-toT(START))/DAY);return d<0?0:Math.floor(d/7)+1}
function weekRange(w){var a=addDays(START,(w-1)*7);return [a,addDays(a,6)]}
function fmt(n){return n==null?'–':(Math.round(n*10)/10).toString().replace('.',',')}
function phaseOf(w){
  if(w<=0)return{nama:'Persiapan',em:'🧭',isi:'Susun aturan bersama, tutup celah teknis, sepakati cara bangun Subuh',patuh:null,subuh:null};
  if(w<=2)return{nama:'Pembiasaan',em:'🌱',isi:'Cek setiap malam; Subuh dibangunkan ayah',patuh:5,subuh:4};
  if(w<=4)return{nama:'Konsistensi',em:'💪',isi:'Cek acak 2–3 kali; Subuh dengan alarm sendiri',patuh:6,subuh:5};
  if(w<=8)return{nama:'Kepercayaan',em:'🌟',isi:'Kelonggaran bertahap; Subuh bangun sendiri',patuh:6,subuh:6};
  return{nama:'Selesai',em:'🎉',isi:'Program 8 minggu sudah lewat; tinjau ulang kesepakatan',patuh:6,subuh:6};

function weekStats(w){

  for(var i=0;i<7;i++){var d=state.daily[addDays(r[0],i)];if(!d)continue;tercatat++;
    (d.tugas||[]).forEach(function(id){if(TUGAS_H.some(function(t){return t[0]===id}))tH++;else if(TUGAS_M.some(function(t){return t[0]===id}))tM[id]=1});
    if(typeof d.olahraga==='number'){oS+=d.olahraga;oN++;if(d.olahraga>=REF_OLAHRAGA)o60++}if(d.otot)otot++;if(d.pengisi==='anak')sendiri++;

    var jn=[].map.call(f.querySelectorAll('[name=jenis]:checked'),function(x){return x.value});if(jn.length)rec.jenis=jn;
    if(f.querySelector('[name=otot]:checked'))rec.otot=true;
    var hmv=function(n){var j=f[n+'J'].value,m=f[n+'M'].value;if(j===''&&m==='')return null;return Math.max(0,(parseInt(j,10)||0)*60+(parseInt(m,10)||0))};
    var sc=hmv('sc'),wa=hmv('wa');if(sc!=null)rec.screen=sc;if(wa!=null)rec.wa=wa;
    var cs=f.catatanSt.value.trim();if(cs)rec.catatanSt=cs;
    if(!rec.malam&&!rec.subuh&&!rec.catatan&&rec.minum==null&&rec.tidur==null&&rec.olahraga==null&&!rec.tugas&&!rec.otot&&rec.screen==null&&rec.wa==null&&!rec.catatanSt&&!rec.mood){msg('Isi minimal satu bagian dulu ya.');return}
    if(rec.malam==='langgar'){rec.celah=[].map.call(f.querySelectorAll('[name=celah]:checked'),function(x){return x.value});rec.konsekuensi=g('konsekuensi')}
    if(rec.subuh==='ya'){rec.tempat=g('tempat');rec.bangun=g('bangun')}
    state.daily[curDate]=rec;
    var nH=(rec.tugas||[]).filter(function(id){return TUGAS_H.some(function(t){return t[0]===id})}).length;
    var cheer=rec.malam==='patuh'&&rec.subuh==='ya'&&nH===TUGAS_H.length?'🏆 Luar biasa! Patuh, berjamaah, dan semua tugas beres':rec.olahraga>=REF_OLAHRAGA&&nH===TUGAS_H.length?'🏅 Keren! Olahraga cukup dan tugas rumah beres':rec.malam==='patuh'&&rec.subuh==='ya'?'🌟 Mantap! Patuh dan Subuh berjamaah':rec.malam==='patuh'?'😊 Tersimpan. Malam ini patuh!':rec.subuh==='ya'?'🕌 Tersimpan. Alhamdulillah ikut berjamaah':'✅ Catatan tersimpan';
    save(cheer);};
}
function task(name,val,em,label,checked,sub){return '<label class="task"><input type="checkbox" name="'+name+'" value="'+val+'"'+(checked?' checked':'')+'><span class="em">'+em+'</span><span class="tx">'+label+(sub?'<small>'+sub+'</small>':'')+'</span><span class="bx"></span></label>'}
function setDate(s){curDate=s;ss('pk-date',s);renderHarian()}

function renderMingguan(){
  var w=curWeek,r=weekRange(w),st=weekStats(w),ph=phaseOf(w),v=state.weekly[w]||{},cek=v.cek||[];
  var pOk=st.patuh>=ph.patuh,sOk=st.subuh>=ph.subuh,tT=tgtTugas(w),tO=tgtOlahraga(w);

  '<div class="card">'+head('cal','Evaluasi minggu '+w,short(r[0])+' – '+short(r[1])+' · '+ph.em+' Fase '+ph.nama)+
  '<div class="weeks">'+[1,2,3,4,5,6,7,8].map(function(i){return '<button data-w="'+i+'" class="'+(i===w?'on':'')+'">M'+i+(state.weekly[i]?' ✓':'')+'</button>'}).join('')+'</div></div>'+
  '<div class="card">'+head('check','Hasil otomatis',st.tercatat+' dari 7 hari dicatat · '+st.sendiri+' diisi anak sendiri')+'<div class="stat">'+
  '<div class="st n"><span class="em">🌙</span><small>Malam patuh</small><b class="'+(st.tercatat?(pOk?'ok':'no'):'')+'">'+st.patuh+' / 7</b><small>target ≥ '+ph.patuh+'</small></div>'+
  '<div class="st d"><span class="em">🕌</span><small>Subuh berjamaah</small><b class="'+(st.tercatat?(sOk?'ok':'no'):'')+'">'+st.subuh+' / 7</b><small>target ≥ '+ph.subuh+'</small></div>'+
  '<div class="st w"><span class="em">💧</span><small>Rata-rata minum</small><b class="'+(st.minum==null?'':(st.minum>=REF_MINUM?'ok':'no'))+'">'+fmt(st.minum)+' gelas</b><small>acuan ± '+REF_MINUM+'</small></div>'+
  '<div class="st s"><span class="em">😴</span><small>Rata-rata tidur</small><b class="'+(st.tidur==null?'':(st.tidur>=REF_TIDUR?'ok':'no'))+'">'+fmt(st.tidur)+' jam</b><small>acuan 8–10</small></div>'+
  '<div class="st c"><span class="em">🧹</span><small>Tugas harian</small><b class="'+(tT!=null&&st.tercatat?(st.tugasH>=tT?'ok':'no'):'')+'">'+st.tugasH+' / '+(TUGAS_H.length*7)+'</b><small>'+(tT==null?'belum jadi target':'target ≥ '+tT)+'</small></div>'+
  '<div class="st c"><span class="em">🧺</span><small>Tugas mingguan</small><b class="'+(tT!=null&&st.tercatat?(st.tugasM>=TUGAS_M.length?'ok':'no'):'')+'">'+st.tugasM+' / '+TUGAS_M.length+'</b><small>'+TUGAS_M.map(function(t){return (st.tugasMSet[t[0]]?'✓ ':'○ ')+t[2]}).join('  ')+'</small></div>'+
  '<div class="st p"><span class="em">🏃</span><small>Rata-rata olahraga</small><b class="'+(tO==null||st.olahraga==null?'':(st.olahraga>=tO?'ok':'no'))+'">'+fmt(st.olahraga)+' mnt</b><small>'+(tO==null?'belum jadi target':'target rata-rata ≥ '+tO+' mnt')+'</small></div>'+
  '<div class="st p"><span class="em">💪</span><small>Penguatan otot</small><b class="'+(w>=7&&st.tercatat?(st.otot>=3?'ok':'no'):'')+'">'+st.otot+' / 3</b><small>'+(w>=7?'target 3× seminggu':'belum jadi target')+'</small></div>'+
  '<div class="st sc"><span class="em">📱</span><small>Rata-rata screen time</small><b>'+fmtHM(st.screen)+'</b><small>dari Family Link</small></div>'+
  '<div class="st sc"><span class="em">💬</span><small>Rata-rata WhatsApp</small><b class="'+(st.wa==null?'':(st.wa<=REF_WA?'ok':'no'))+'">'+fmtHM(st.wa)+'</b><small>'+st.waOk+' dari '+st.waN+' hari ≤ '+fmtHM(REF_WA)+'</small></div></div>'+
  (st.langgar?'<div class="daylabel">Celah minggu ini: '+Object.keys(st.celah).map(function(k){return emOf(k)+' '+esc(k)+' ('+st.celah[k]+')'}).join(', ')+'</div>':'')+
  (st.scNotes.length?'<div class="q">📱 Catatan screen time</div><ul class="plain">'+st.scNotes.map(function(n){return '<li><span>'+DAYS_FULL[dow(n[0])]+'</span><span style="text-align:right;max-width:70%">'+esc(n[1])+'</span></li>'}).join('')+'</ul>':'')+'</div>'+
  '<form id="f"><div class="card dawn">'+head('talk','Ngobrol bersama anak','10 menit, mulai dari yang berjalan baik')+
  QS.map(function(q,i){return '<div class="q">'+q[0]+' '+q[1]+'</div><textarea name="q'+i+'">'+esc(v['q'+i])+'</textarea>'}).join('')+'</div>'+
  '<div class="card note check">'+head('check','Cek diri orang tua','Centang yang sudah dijalankan')+CEK.map(function(c,i){return '<label><input type="checkbox" name="cek" value="'+i+'"'+(cek[i]?' checked':'')+'><span>'+c+'</span></label>'}).join('')+'</div>'+
  '<div class="card chore">'+head('chore','Mengatur diri sendiri','Anak menyusun jadwal minggu depan: piano, belajar, tugas rumah, olahraga')+
  tiles('jadwal',[['ya','Sudah disusun sendiri','🗓️'],['bantu','Masih dibantu','🤝'],['belum','Belum','⏳',1]],v.jadwal,true)+'</div>'+
  '<div class="card sleep">'+head('flag','Keputusan minggu depan','')+tiles('keputusan',[['longgar','Tambah kelonggaran','🎁'],['tetap','Tetap','👍'],['ulang','Ulangi fase','🔁',1]],v.keputusan,true)+
  '<div class="q">Catatan keputusan</div><textarea name="catatan">'+esc(v.catatan)+'</textarea></div>'+
  '<button class="save" type="submit">💾 Simpan evaluasi minggu '+w+'</button><div class="status" id="st"></div></form>';
  [].forEach.call(app.querySelectorAll('[data-w]'),function(b){b.onclick=function(){curWeek=+b.dataset.w;ss('pk-week',curWeek);renderMingguan()}});
  var f=document.getElementById('f');
  f.onsubmit=function(e){e.preventDefault();var rec={};QS.forEach(function(_,i){rec['q'+i]=f['q'+i].value.trim()});
    var c=[];[].forEach.call(f.querySelectorAll('[name=cek]'),function(x){c[+x.value]=x.checked});rec.cek=c;
    var k=f.querySelector('[name=keputusan]:checked');rec.keputusan=k?k.value:'';
    var jd=f.querySelector('[name=jadwal]:checked');rec.jadwal=jd?jd.value:'';rec.catatan=f.catatan.value.trim();
    state.weekly[w]=rec;save('📅 Evaluasi minggu '+w+' tersimpan');};
}

function ring(val,max,color){var r=38,c=2*Math.PI*r,p=max?Math.min(1,val/max):0;
  return '<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 46 46)"/><text x="46" y="44" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">'+val+'/'+max+'</text><text x="46" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)" font-family="Nunito,sans-serif">hari dicatat</text></svg>'}

function renderRingkasan(){
  var t=todayStr(),w=weekOf(t),ph=phaseOf(w),html=banner(),ws=w>=1&&w<=8?weekStats(w):null;
  html+='<div class="card night"><div class="ringrow">'+ring(ws?ws.tercatat:0,7,'var(--night)')+'<div class="phase"><b>'+ph.em+' Fase '+ph.nama+'</b><span>'+(w&&w<=8?'Minggu '+w+' dari 8 · ':'')+ph.isi+'<br>🎯 Fokus sekarang: '+(w>=1?fokusTxt(w):'persiapan')+'</span></div></div></div>';
  html+='<div class="badges" style="margin-bottom:14px"><div class="badge" style="background:var(--night-soft)"><div class="em">🔥</div><b>'+streak('malam','patuh')+'</b><small>malam patuh berturut-turut</small></div>'+
        '<div class="badge" style="background:var(--dawn-soft)"><div class="em">🕌</div><b>'+streak('subuh','ya')+'</b><small>Subuh berjamaah berturut-turut</small></div></div>';
  var days=[];for(var i=6;i>=0;i--)days.push(addDays(t,-i));
  var row=function(key,good,yes,no){return days.map(function(s){var d=state.daily[s],v=d&&d[key];
    return '<div><div class="dot '+(!v?'':(v===good?'g':'r'))+'">'+(!v?'·':(v===good?yes:no))+'</div>'+DAYS[dow(s)]+'</div>'}).join('')};
  var nrow=function(key,ref){return days.map(function(s){var d=state.daily[s],v=d&&typeof d[key]==='number'?d[key]:null;
    return '<div><div class="dot v '+(v==null?'':(v>=ref?'g':'r'))+'">'+(v==null?'·':fmt(v))+'</div>'+DAYS[dow(s)]+'</div>'}).join('')};
  html+='<div class="card">'+head('cal','7 hari terakhir','Hijau = sesuai target')+
        '<div class="sub2">🌙 Aturan malam</div><div class="dots">'+row('malam','patuh','😊','😕')+'</div>'+
        '<div class="sub2">🕌 Subuh berjamaah</div><div class="dots">'+row('subuh','ya','🕌','😴')+'</div>'+
        '<div class="sub2">💧 Minum (gelas)</div><div class="dots">'+nrow('minum',REF_MINUM)+'</div>'+
        '<div class="sub2">😴 Tidur (jam)</div><div class="dots">'+nrow('tidur',REF_TIDUR)+'</div>'+
        '<div class="sub2">🙂 Perasaan</div><div class="dots">'+days.map(function(s){var d=state.daily[s],m=d&&d.mood,e='·';MOOD.forEach(function(o){if(o[0]===m)e=o[2]});return '<div><div class="dot">'+e+'</div>'+DAYS[dow(s)]+'</div>'}).join('')+'</div>'+
        '<div class="sub2">🧹 Tugas harian (dari '+TUGAS_H.length+')</div><div class="dots">'+days.map(function(s){var d=state.daily[s];
          var n=d?(d.tugas||[]).filter(function(id){return TUGAS_H.some(function(t){return t[0]===id})}).length:null;
          return '<div><div class="dot v '+(n==null?'':(n>=TUGAS_H.length?'g':'r'))+'">'+(n==null?'·':n)+'</div>'+DAYS[dow(s)]+'</div>'}).join('')+'</div>'+
        '<div class="sub2">🏃 Olahraga (menit)</div><div class="dots">'+nrow('olahraga',REF_OLAHRAGA)+'</div>'+
        '<div class="sub2">💬 WhatsApp (menit)</div><div class="dots">'+days.map(function(s){var d=state.daily[s],v=d&&typeof d.wa==='number'?d.wa:null;
          return '<div><div class="dot v '+(v==null?'':(v<=REF_WA?'g':'r'))+'">'+(v==null?'·':Math.round(v))+'</div>'+DAYS[dow(s)]+'</div>'}).join('')+'</div></div>';
  html+='<div class="badges" style="margin-bottom:14px"><div class="badge" style="background:var(--chore-soft)"><div class="em">🧹</div><b>'+streakTugas()+'</b><small>hari semua tugas harian beres</small></div>'+
        '<div class="badge" style="background:var(--sport-soft)"><div class="em">🏅</div><b>'+streakNum('olahraga',REF_OLAHRAGA)+'</b><small>hari olahraga ≥ '+REF_OLAHRAGA+' menit berturut-turut</small></div></div>';
  var last=Math.min(8,Math.max(1,w));
  html+='<div class="card">'+head('flag','Per minggu dibanding target','')+'<div class="legend"><span><i style="background:var(--night)"></i>Malam patuh</span><span><i style="background:var(--dawn)"></i>Subuh berjamaah</span><span><i style="background:var(--ink);width:3px"></i>Target</span></div><div class="bars">';
  for(var k=1;k<=last;k++){var s=weekStats(k),p=phaseOf(k);
    html+='<div class="brow"><div>M'+k+'</div><div><div class="track"><div class="fill" style="width:'+(s.patuh/7*100)+'%"></div><div class="tgt" style="left:'+(p.patuh/7*100)+'%"></div></div>'+
    '<div class="track"><div class="fill s" style="width:'+(s.subuh/7*100)+'%"></div><div class="tgt" style="left:'+(p.subuh/7*100)+'%"></div></div></div></div>';}
  html+='</div></div>';
  var all={};Object.keys(state.daily).forEach(function(s){var d=state.daily[s];if(d.malam==='langgar')(d.celah||[]).forEach(function(c){all[c]=(all[c]||0)+1})});
  var ks=Object.keys(all).sort(function(a,b){return all[b]-all[a]});
  html+='<div class="card night">'+head('night','Celah yang paling sering','Fokus tutup yang paling atas')+(ks.length?'<ul class="plain">'+ks.map(function(c){return '<li><span>'+emOf(c)+' '+esc(c)+'</span><span>'+all[c]+'×</span></li>'}).join('')+'</ul>':'<div class="empty"><span class="em">🎉</span>Belum ada pelanggaran yang dicatat.</div>')+'</div>';
  app.innerHTML=html;
}

function tLines(a){return a.map(function(t){return t[2]+' '+t[1]}).join('\n')}
function parseLines(txt,old,pre){var out=[];txt.split('\n').forEach(function(l,i){l=l.trim();if(!l)return;var em='⭐',label=l,sp=l.indexOf(' ');
  if(sp>0&&sp<=8&&!/[A-Za-z0-9]/.test(l.slice(0,sp))){em=l.slice(0,sp);label=l.slice(sp+1).trim()}
  if(!label)return;var id=null;old.forEach(function(o){if(o[1]===label)id=o[0]});
  out.push([id||(pre+Date.now().toString(36)+i),label,em])});return out}
function renderAtur(){
  app.innerHTML=banner()+
  '<div class="card night">'+head('flag','Urutan mulai kebiasaan','Bertahap, supaya tidak terlalu berat di awal')+'<ul class="plain">'+
  '<li><span>🌙 Aturan malam dan 🕌 Subuh</span><span>Minggu 1</span></li><li><span>🧹 Tugas rumah</span><span>Minggu 3</span></li>'+
  '<li><span>🏃 Olahraga</span><span>Minggu 5</span></li><li><span>💧 Minum, 😴 tidur, 📱 screen time</span><span>dicatat saja</span></li></ul></div>'+
  '<form id="f"><div class="card chore">'+head('chore','Daftar tugas rumah','Satu tugas per baris, boleh diawali emoji')+
  '<label class="fld">Tugas harian<textarea name="th">'+esc(tLines(TUGAS_H))+'</textarea></label>'+
  '<label class="fld">Tugas mingguan<textarea name="tm">'+esc(tLines(TUGAS_M))+'</textarea></label>'+
  '<div class="hint">Tugas yang namanya diganti dihitung sebagai tugas baru.</div></div>'+
  '<div class="card sleep">'+head('cal','Jam dan acuan','Sesuaikan dengan kesepakatan keluarga')+
  '<label class="fld" style="margin-top:0">Jam perangkat dikumpulkan<input name="jam" value="'+esc(JAM)+'"></label>'+
  '<div class="two"><label class="fld">Minum (gelas)<input name="minum" type="number" inputmode="decimal" min="1" max="20" value="'+REF_MINUM+'"></label>'+
  '<label class="fld">Tidur minimal (jam)<input name="tidur" type="number" inputmode="decimal" min="4" max="12" step="0.5" value="'+REF_TIDUR+'"></label>'+
  '<label class="fld">Olahraga (menit)<input name="olahraga" type="number" inputmode="numeric" min="10" max="300" value="'+REF_OLAHRAGA+'"></label>'+
  '<label class="fld">WhatsApp maks (menit)<input name="wa" type="number" inputmode="numeric" min="0" max="600" value="'+REF_WA+'"></label></div></div>'+
  '<button class="save" type="submit">💾 Simpan pengaturan</button><div class="status" id="st"></div></form>'+backupBlock();
  var f=document.getElementById('f');
  f.onsubmit=function(e){e.preventDefault();var th=parseLines(f.th.value,TUGAS_H,'h'),tm=parseLines(f.tm.value,TUGAS_M,'m');
    if(!th.length){msg('Isi minimal satu tugas harian.');return}
    state.config={tugasH:th,tugasM:tm,jam:f.jam.value.trim()||'21.00',minum:+f.minum.value||8,tidur:+f.tidur.value||8,olahraga:+f.olahraga.value||60,wa:+f.wa.value||120};
    save('⚙️ Pengaturan tersimpan',true);};
  wireBackup();
}
function msg(t){var el=document.getElementById('st');if(el)el.textContent=t}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},2600)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storeOk=true;return true}catch(e){storeOk=false;return false}}
function save(cheer,reload){
  if(!persist()){msg('Gagal menyimpan di HP ini. Pastikan bukan mode penyamaran dan memori HP tidak penuh.');return}
  if(reload){ss('pk-toast',cheer||'✅ Tersimpan');location.reload();return}
  toast(cheer||'✅ Tersimpan');route();window.scrollTo(0,0);
}
function backupBlock(){var n=Object.keys(state.daily).length;
  return '<div class="card water">'+head('water','Cadangan data','Data hanya tersimpan di HP ini, '+n+' hari tercatat')+
  '<button type="button" class="save" id="bk" style="background:var(--water);box-shadow:none">⬇️ Unduh cadangan</button>'+
  '<label class="soonbar" style="display:block;margin-top:10px;text-align:center">📂 Pulihkan dari file cadangan<input type="file" id="rs" accept="application/json,.json" style="display:none"></label>'+
  '<div class="hint">Unduh cadangan seminggu sekali, misalnya setelah evaluasi hari Minggu. Simpan filenya di Google Drive.</div><div class="status" id="bst"></div></div>'}
function wireBackup(){var b=document.getElementById('bk');if(!b)return;
  b.onclick=function(){var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='cadangan-catatan-keluarga-'+todayStr()+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);document.getElementById('bst').textContent='File cadangan diunduh ke folder Download.'};
  document.getElementById('rs').onchange=function(e){var fl=e.target.files[0];if(!fl)return;var r=new FileReader();
    r.onload=function(){try{var s=JSON.parse(r.result);if(!s||typeof s.daily!=='object')throw 0;
      if(!window.__konfirm){window.__konfirm=1;document.getElementById('bst').textContent='Data di HP ini akan diganti isi file. Pilih file yang sama sekali lagi untuk melanjutkan.';e.target.value='';return}
      state=s;state.weekly=state.weekly||{};save('📂 Data dipulihkan',true)}catch(x){document.getElementById('bst').textContent='File ini bukan cadangan catatan keluarga.'}};r.readAsText(fl)}}

function greet(){var h=new Date().getHours(),g=h<4?'Selamat malam':h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  var w=weekOf(todayStr()),ph=phaseOf(w);
  document.getElementById('greet').textContent="Assalamu'alaikum · "+g;
  document.getElementById('pill').textContent=ph.em+' Fase '+ph.nama+(w&&w<=8?' · Minggu '+w+'/8':'');}
function route(){var h=(location.hash||'').slice(1);tab=['harian','mingguan','ringkasan','atur'].indexOf(h)>-1?h:'harian';
  [].forEach.call(document.querySelectorAll('.tabbar a'),function(a){a.className=a.dataset.tab===tab?'on':''});
  if(tab==='harian')renderHarian();else if(tab==='mingguan')renderMingguan();else if(tab==='ringkasan')renderRingkasan();else renderAtur();}
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0)});
greet();route();
var tq=ss('pk-toast');if(tq){ss('pk-toast',null);toast(tq)}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
